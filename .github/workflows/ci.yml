name: CI

on:
  pull_request:
    branches: ["main", "master", "trunk"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up content repo deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CONTENT_DEPLOY_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: make ci

      - name: Type check
        run: make check

      - name: Test
        run: make test

      - name: Build site
        run: make build
