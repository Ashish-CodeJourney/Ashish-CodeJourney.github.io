name: Deploy

on:
  push:
    branches: ["main", "master", "trunk"]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

env:
  SITE_ORIGIN: https://ashishvaghela.in

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up content repo deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CONTENT_DEPLOY_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout content submodule
        run: git submodule update --init --depth=1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make ci

      - name: Build site
        run: make build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output
        run: make test-build

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true

  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ env.SITE_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.1"
          command: deploy

  # The old *.github.io address only serves github-pages/, a redirect to the custom domain.
  redirect-github-pages:
    runs-on: ubuntu-latest
    needs: deploy-cloudflare
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
