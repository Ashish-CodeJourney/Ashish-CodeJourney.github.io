<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Journey Interrupted</title>
  <meta name="description" content="Oops! You've wandered off the path of the journey.">
  <link rel="icon" type="image/jpeg" href="assets/avatar.jpg">
  
  <!-- oat.ink CSS -->
  <link rel="stylesheet" href="assets/oat.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="site-wrapper container">
    <div class="error-container">
      <img src="assets/404-illustration.png" alt="Lost Explorer" class="error-illustration">
      <h1 class="error-title">Journey Interrupted</h1>
      <p class="error-text">
        Oops! It looks like you've wandered into a bit of unmapped territory. 
        This part of the adventure hasn't been coded yet, or maybe a rogue bug hid the path.
      </p>
      <a href="/#/" class="button primary back-home-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Teleport Home
      </a>
    </div>
  </div>

  <script>
    // Simple theme persistence for the 404 page
    const theme = localStorage.getItem('theme');
    if (theme === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
    } else if (theme === 'light') {
      document.body.removeAttribute('data-theme');
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
       document.body.setAttribute('data-theme', 'dark');
    }
  </script>
</body>

</html>
