<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <base href="/">
  <meta name="description" content="Personal website of Ashish">
  <link rel="icon" type="image/jpeg" href="assets/avatar.jpg">

  <!-- oat.ink CSS -->
  <link rel="stylesheet" href="assets/oat.min.css">

  <!-- Google Fonts: DM Sans + Cormorant Garamond + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ERND4QRRN0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ERND4QRRN0');
  </script>
</head>

<body>

<div class="site-wrapper">

  <!-- Header -->
  <header class="site-header hstack justify-between">
    <a href="#/" class="hstack gap-2 unstyled-link" style="gap:0.6rem; text-decoration:none; color:inherit;">
      <img src="assets/avatar.jpg" alt="Ashish" class="brand-avatar" width="32" height="32">
      <span class="brand-name">Ashish</span>
    </a>

    <div class="hstack gap-4">
      <!-- Desktop Nav -->
      <nav class="desktop-nav hstack gap-4">
        <a href="/" class="nav-link">Home</a>
        <a href="/writings/" class="nav-link">Writings</a>
        <a href="/technical/" class="nav-link">Technical</a>
        <a href="/now/" class="nav-link">Now</a>
      </nav>

      <!-- Mobile Toggle -->
      <button id="mobile-menu-toggle" class="button icon-only mobile-menu-toggle" aria-label="Toggle menu" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Nav -->
  <nav id="mobile-nav" class="mobile-nav hidden">
    <a href="/" class="nav-link">Home</a>
    <a href="/writings/" class="nav-link">Writings</a>
    <a href="/technical/" class="nav-link">Technical</a>
    <a href="/now/" class="nav-link">Now</a>
    <label class="mobile-theme-wrapper hstack justify-between" style="margin-top: 1rem;">
      <span id="mobile-theme-label" class="text-sm muted">Light mode</span>
      <input type="checkbox" id="mobile-theme-switch" role="switch">
    </label>
  </nav>

  <!-- Main -->
  <main class="site-content view-enter">
    {{CONTENT}}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>
      &copy; 2026 Ashish Vaghela ·
      Built with
      <a href="https://oat.ink/" target="_blank" rel="noopener">oat.ink</a>
    </p>

    <p>
      Content licensed under
      <u>
        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">
          CC BY-NC-SA 4.0
        </a>
      </u>.
      Code licensed under
      <u>
        <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">
          GNU AGPL v3.0
        </a>
      </u>,
      available
      <a href="https://github.com/Ashish-CodeJourney/Ashish-CodeJourney.github.io" target="_blank" rel="noopener">
        here
      </a>.
    </p>
  </footer>


</div>

<!-- Theme Toggle (desktop, floating) -->
<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
  <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>



<!-- App -->
<script src="app.js" defer></script>

</body>
</html>
